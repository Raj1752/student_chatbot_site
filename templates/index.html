<!DOCTYPE html>
<html>
<head>
    <title>School Chatbot</title>

    <style>

        body {
            font-family: Arial;
            padding: 20px;
            background: #000000;
            color: white;
        }

        #box {
            max-width: 700px;
            margin: auto;
            background: #000000;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #0b5d1e;
            box-shadow: 0 0 15px rgba(0,255,65,0.15);
        }

        h2{
            color:white;
        }

        input{
            width:80%;
            padding:12px;
            background:#000000;
            color:#39FF14;
            border:1px solid #39FF14;
            border-radius:5px;
            font-size:18px;
            outline:none;
        }

        input::placeholder{
            color:#39FF14;
            opacity:0.7;
        }

        button{
            padding:12px 18px;
            background:#8A2BE2;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-weight:bold;
            transition:0.2s;
        }

        button:hover{
            background:#A855F7;
        }

        #response{
            margin-top:25px;
            font-size:18px;
            color:#D8B4FE;
            white-space:pre-line;
            line-height:1.6;
        }

    </style>

</head>

<body>

<div id="box">

<h2>🤖 School Chatbot</h2>

<input
id="userInput"
placeholder="Ask me something..."
>

<button onclick="sendMessage()">Send</button>

<p id="response"></p>

</div>

<script>

function sendMessage(){

    let message=document.getElementById("userInput").value;

    fetch("/ask",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            question:message
        })

    })

    .then(response=>response.json())

    .then(data=>{

        document.getElementById("response").innerHTML=

        data.answer+

        "<br><br><small style='color:#00E5FF;font-size:15px;'>"+

        data.time+

        " s</small>";

    });

}

</script>

</body>
</html>
